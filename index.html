<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' file: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Validador de pagos a contratistas — SENA</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f8;
  --panel: #ffffff;
  --ink: #17232f;
  --ink-2: #4a5a6a;
  --ink-3: #6b7a89;
  --line: #dbe1e8;
  --line-2: #eceff3;
  --accent: #39a900;
  --accent-ink: #1f6b00;
  --accent-soft: #e8f6dc;
  --ok: #1f6b00;       --ok-bg: #e6f4da;
  --err: #b3261e;      --err-bg: #fde8e6;
  --adv: #8a5a00;      --adv-bg: #fff2cf;
  --nv: #3b4f9a;       --nv-bg: #e7ebfb;
  --info: #3f5566;     --info-bg: #e9eef3;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(23, 35, 47, .06), 0 4px 14px rgba(23, 35, 47, .05);
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "SFMono-Regular", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---- Barra superior ---- */
.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; gap: 12px; align-items: center; margin-right: auto; }
.mark { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; flex: none; }
.brand h1 { font-size: 1.15rem; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: .82rem; color: var(--ink-3); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.store-mode { font-size: .78rem; color: var(--ink-3); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; background: var(--bg); }
.store-mode.warn { color: var(--adv); background: var(--adv-bg); border-color: #ecd49a; }

/* ---- Botones ---- */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 550; font-size: .92rem; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg); border-color: #c5cdd7; }
.btn:focus-visible, .tab:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #8fd35c; outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d2b00; }
.btn.primary:hover { background: #46c20a; }
.btn.danger { color: var(--err); border-color: #efc2be; }
.btn.danger:hover { background: var(--err-bg); }
.btn.solid-danger { background: var(--err); color: #fff; border-color: var(--err); }
.btn.sm { padding: 4px 9px; font-size: .84rem; }
.btn.icon-only { padding: 5px 7px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); min-width: 240px; padding: 5px; z-index: 30; display: flex; flex-direction: column; }
.menu-list button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.menu-list button:hover { background: var(--bg); }
.menu-list hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; cursor: pointer; }

/* ---- Estructura ---- */
main { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { padding: 12px 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-size: 1rem; }
.card-b { padding: 14px 16px; }
.stack { display: grid; gap: 16px; }

/* ---- Zona de carga ---- */
.drop { border: 2px dashed #b9c4d0; border-radius: var(--radius); background: #fff; padding: 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; transition: border-color .12s, background .12s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { font-size: 1.05rem; }
.drop p { margin: 2px 0 0; color: var(--ink-3); font-size: .9rem; }
.drop .grow { flex: 1; min-width: 240px; }

/* ---- Cola ---- */
.queue { display: grid; gap: 6px; }
.q-item { display: grid; grid-template-columns: minmax(180px, 2fr) 3fr; gap: 6px 14px; align-items: center; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: #fbfcfd; }
.q-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-msg { font-size: .88rem; color: var(--ink-2); grid-column: 1 / -1; }
.bar { height: 6px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.q-item.err .q-msg { color: var(--err); }

/* ---- Pendientes ---- */
.pend { border: 1px solid #ecd49a; background: #fffaf0; border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.pend .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
label.f { display: grid; gap: 3px; font-size: .82rem; color: var(--ink-2); font-weight: 600; }
input[type=text], input[type=search], input[type=month], input[type=number], select, textarea { border: 1px solid #c3ccd6; border-radius: 7px; padding: 6px 9px; background: #fff; min-width: 0; }
textarea { width: 100%; }

/* ---- Estadísticas ---- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.stat:hover { border-color: #b7c2cf; }
.stat[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: -1px; }
.stat b { font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; }
.stat span { font-size: .82rem; color: var(--ink-2); display: flex; gap: 5px; align-items: center; }

/* ---- Filtros y tabla ---- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.filters .grow { flex: 1; min-width: 220px; }
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 650; padding: 9px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; white-space: nowrap; }
table.t th button { background: none; border: 0; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
table.t td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tbody tr:hover { background: #fafcf8; }
.nm small.idp .idv { white-space: nowrap; }
table.t td.r, table.t th.r { text-align: right; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-3); }
.nm { font-weight: 650; }
.nm small { display: block; font-weight: 400; color: var(--ink-3); }
.acts { display: flex; gap: 6px; justify-content: flex-end; }

/* ---- Chips de estado (icono + texto, no solo color) ---- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 99px; font-size: .78rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; border: 1px solid transparent; }
.chip svg { width: 13px; height: 13px; flex: none; }
.chip.OK, .chip.VALIDO, .chip.FIRMADA { color: var(--ok); background: var(--ok-bg); border-color: #c5e5ae; }
.chip.ERROR, .chip.SINFIRMA { color: var(--err); background: var(--err-bg); border-color: #f4c6c2; }
.chip.ADVERTENCIA, .chip.VALIDOCONADVERTENCIAS { color: var(--adv); background: var(--adv-bg); border-color: #ecd49a; }
.chip.NOVERIFICABLE, .chip.REQUIEREREVISION, .chip.PENDIENTE { color: var(--nv); background: var(--nv-bg); border-color: #c8d1f3; }
.chip.INFO, .chip.neutral { color: var(--info); background: var(--info-bg); border-color: #d3dce4; }
.chip.big { font-size: .95rem; padding: 5px 14px 5px 10px; }
.chip.big svg { width: 17px; height: 17px; }
.ed-badge { display: inline-flex; align-items: center; gap: 3px; color: var(--adv); background: var(--adv-bg); border-radius: 6px; padding: 0 6px; font-size: .74rem; font-weight: 700; }
.ed-badge svg { width: 11px; height: 11px; }

/* ---- Detalle ---- */
.d-head { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 14px; }
.d-head h2 { font-size: 1.4rem; letter-spacing: -.01em; }
.d-head .sub { color: var(--ink-3); font-size: .92rem; }
.d-head .grow { flex: 1; min-width: 240px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .cnt { font-size: .74rem; border-radius: 99px; padding: 0 7px; background: var(--err-bg); color: var(--err); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
dl.kv { display: grid; grid-template-columns: minmax(150px, 40%) 1fr; margin: 0; }
dl.kv dt, dl.kv dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
dl.kv dt { color: var(--ink-2); font-size: .9rem; padding-right: 12px; }
dl.kv dd { font-weight: 600; word-break: break-word; }
table.f { width: 100%; border-collapse: collapse; font-size: .91rem; }
table.f th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 6px 10px 6px 0; width: 40%; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.f td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.f td.v { font-weight: 600; word-break: break-word; }
table.f td.pg { color: var(--ink-3); width: 56px; white-space: nowrap; }
table.f td.ac { width: 74px; text-align: right; white-space: nowrap; }
.orig { display: block; font-weight: 400; color: var(--ink-3); font-size: .82rem; }
.missing { color: var(--err); font-weight: 500; font-style: italic; }
.sec-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; margin: 0 0 6px; }
.note { font-size: .88rem; color: var(--ink-2); background: var(--info-bg); border-radius: 8px; padding: 8px 12px; }
.note.warn { background: var(--adv-bg); color: #5c3d00; }
.note.bad { background: var(--err-bg); color: #7c1a14; }

/* ---- Validaciones ---- */
.vgroup { border: 1px solid var(--line); border-radius: 9px; background: #fff; overflow: hidden; }
.vgroup > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.vgroup > summary::-webkit-details-marker { display: none; }
.vgroup > summary .vid { font-family: var(--mono); font-weight: 700; background: var(--bg); border-radius: 6px; padding: 1px 8px; }
.vgroup > summary .vt { font-weight: 650; flex: 1; min-width: 200px; }
.vgroup > summary .vn { color: var(--ink-3); font-size: .84rem; }
.vgroup > summary::after { content: "▾"; color: var(--ink-3); }
.vgroup[open] > summary::after { content: "▴"; }
.vitem { border-top: 1px solid var(--line-2); padding: 10px 14px; display: grid; gap: 6px; }
.vitem .vr { display: flex; gap: 10px; align-items: flex-start; }
.vitem .vr .chip { flex: none; margin-top: 1px; }
.vitem .vr .rule { font-weight: 600; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 14px; font-size: .88rem; padding-left: 2px; }
.cmp div { background: #f7f9fb; border-radius: 6px; padding: 5px 9px; }
.cmp small { display: block; color: var(--ink-3); }
.cmp b { word-break: break-word; }
.vexp { font-size: .86rem; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--ink-2); border-right: 1px solid var(--line-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent-ink); }

/* ---- Comisiones ---- */
.com { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.com + .com { margin-top: 14px; }
.com-h { padding: 11px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; background: #fafbfc; border-radius: var(--radius) var(--radius) 0 0; }
.com-h h3 { font-size: 1.05rem; }
.doc-block { padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.doc-block:last-child { border-bottom: 0; }
.doc-block h4 { font-size: .95rem; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dup { font-size: .76rem; font-weight: 600; color: var(--info); background: var(--info-bg); border-radius: 6px; padding: 1px 7px; }
table.mini { border-collapse: collapse; font-size: .88rem; margin-top: 6px; }
table.mini th, table.mini td { border: 1px solid var(--line-2); padding: 4px 9px; text-align: left; }
table.mini th { background: #fafbfc; font-weight: 600; color: var(--ink-2); }
table.mini td.r { text-align: right; }

/* ---- Revisión visual ---- */
.rv { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 960px) { .rv { grid-template-columns: 1fr; } }
.pglist { display: grid; gap: 3px; max-height: 520px; overflow: auto; }
.pgbtn { text-align: left; border: 1px solid transparent; background: none; border-radius: 7px; padding: 6px 9px; cursor: pointer; display: grid; gap: 0; }
.pgbtn:hover { background: var(--bg); }
.pgbtn[aria-current=true] { background: var(--accent-soft); border-color: #c5e5ae; }
.pgbtn b { font-size: .86rem; }
.pgbtn small { color: var(--ink-3); }
.canvas-wrap { position: relative; display: inline-block; max-width: 100%; overflow: auto; border: 1px solid var(--line); background: #fff; }
.canvas-wrap canvas { display: block; }
.roi-box { position: absolute; border: 2px dashed #1f78d1; background: rgba(31, 120, 209, .08); pointer-events: none; }
.roi-box.sel { border-color: #d46b00; background: rgba(212, 107, 0, .12); border-style: solid; }
.roi-box span { position: absolute; top: -17px; left: -2px; font-size: 11px; background: #1f78d1; color: #fff; padding: 0 5px; border-radius: 3px; white-space: nowrap; }
.roi-box.sel span { background: #d46b00; }
.ink-box { position: absolute; border: 2px solid #e0197d; pointer-events: none; }
.sig-crop canvas { border: 1px solid var(--line); background: #fff; max-width: 100%; }
.sigrow-sel { background: var(--accent-soft); }

/* ---- Diálogos ---- */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; box-shadow: 0 18px 60px rgba(10, 20, 30, .28); max-width: min(92vw, 760px); width: 100%; color: var(--ink); background: #fff; }
dialog.wide { max-width: min(96vw, 1000px); }
dialog::backdrop { background: rgba(15, 25, 35, .45); }
.dlg-h { padding: 14px 18px; border-bottom: 1px solid var(--line-2); font-weight: 700; font-size: 1.05rem; }
.dlg-b { padding: 16px 18px; max-height: 68vh; overflow: auto; display: grid; gap: 12px; }
.dlg-f { padding: 12px 18px; border-top: 1px solid var(--line-2); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: #fafbfc; border-radius: 0 0 12px 12px; }
.dlg-b p { margin: 0; white-space: pre-line; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; }
fieldset { border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px 12px; margin: 0; }
fieldset legend { font-weight: 700; font-size: .88rem; padding: 0 6px; }
.err-text { color: var(--err); font-size: .88rem; font-weight: 600; }
.test-row { display: grid; grid-template-columns: 70px 56px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line-2); font-size: .88rem; }
.test-sum { font-weight: 700; }

/* ---- Avisos ---- */
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 100; max-width: min(420px, 92vw); }
.toast { background: #17232f; color: #fff; border-radius: 9px; padding: 10px 14px; box-shadow: var(--shadow); font-size: .92rem; white-space: pre-line; }
.toast.err { background: var(--err); }
.toast.ok { background: #1f6b00; }

/* ---- Impresión ---- */
#reporte { display: none; }
@media print {
  body { background: #fff; font-size: 11pt; }
  #app, #toasts, dialog { display: none !important; }
  #reporte { display: block !important; }
  .rep-reg { page-break-after: always; }
  .rep-reg:last-child { page-break-after: auto; }
  .chip { border: 1px solid #888 !important; background: #fff !important; color: #000 !important; }
  table.rep { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 6px 0 12px; }
  table.rep th, table.rep td { border: 1px solid #999; padding: 3px 6px; text-align: left; vertical-align: top; white-space: pre-line; }
  table.rep th { background: #eee; }
  h1, h2, h3 { color: #000; }
}
#reporte h1 { font-size: 16pt; margin-bottom: 4px; }
#reporte h2 { font-size: 12pt; margin: 14px 0 4px; }
#reporte p { margin: 2px 0; font-size: 10pt; }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
        <div>
          <h1>Validador de pagos a contratistas</h1>
          <p>Verificación documental local · los PDF no salen de este equipo</p>
        </div>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="reporte" aria-hidden="true"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="file-pdf" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>

<script src="libs/pdf.min.js"></script>
<script>/* ===== util.js ===== */
/* util.js — normalización y parseo (montos, cédulas, nombres, fechas). Sin dependencias. */
(function (g) {
  'use strict';
  const VC = (g.VC = g.VC || {});

  /* Plegado 1:1 (conserva longitud): quita tildes y pasa a minúscula. Los índices de la
     cadena plegada sirven para cortar el texto original. */
  function fold(s) {
    s = String(s == null ? '' : s);
    let out = '';
    for (const ch of s) {
      const d = ch.normalize('NFD');
      out += d.charAt(0);
    }
    return out.toLowerCase();
  }
  /* Normalización de texto libre: plegado + espacios colapsados. */
  function norm(s) {
    return fold(s).replace(/[\s ]+/g, ' ').trim();
  }

  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const MES_ABR = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const MES_ABR_MAP = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12 };

  function mesNum(name) {
    const n = norm(name).replace(/\./g, '');
    if (!n) return null;
    if (n === 'setiembre') return 9;

  /* ====================== Extractor: Planilla SI ====================== */

  /* ====================== Extractor: Comprobante GRF-F-076 ====================== */
  function extractComprobante(page, S, cfg) {
    const E = { pg: page.index, dup: 0, firmas: {}, tramos: [] };

    const rN = hNC ? rowRight(S, hNC, { tol: 4 }).filter((x) => !hCC || x.x0 < hCC.x0 - 2) : [];
    E.nombre = fText(rN.length ? { t: rN.map((x) => x.t).join(' '), seg: rN[0] } : null);

  /* ====================== Análisis de un PDF (lista de modelos de página) ====================== */
  function etiquetaPagina(cl) {
    switch (cl.tipo) {
      case 'A': return 'Planilla SI contratistas';
      case 'B': return (cl.fam === 'desconocida' ? 'PILA — formato no reconocido' : 'PILA') + (cl.n && cl.de > 1 ? ' (pág. ' + cl.n + '/' + cl.de + ')' : '');
      case 'C': return 'SIIF comisión' + (cl.n ? ' (pág. ' + cl.n + (cl.de ? '/' + cl.de : '') + ')' : '');
      case 'D': return 'Informe legalización — ' + ({ portada: 'portada', datos: 'datos', firmas: 'compromisos y firmas', control: 'control de cambios', cont: 'continuación' }[cl.sub] || '');
      case 'E': return 'Comprobante gastos de transporte';
      case 'F': return 'Radicado';
      case 'SIN_TEXTO': return 'SIN TEXTO - REQUIERE REVISIÓN MANUAL';
      case 'ILEGIBLE': return 'TEXTO ILEGIBLE (fuente sin codificación) - REQUIERE REVISIÓN MANUAL';
      default: return 'No reconocida';

  function analyze(pages, fileName, cfgIn) {
    const cfg = cfgIn || cloneCfg(DEFAULT_CFG);

    const paginas = pages.map((p, i) => ({ n: p.index + 1, pg: p.index, tipo: cls[i].tipo, sub: cls[i].sub || null, etiqueta: etiquetaPagina(cls[i]), detalle: null }));

    /* 1) Documentos consecutivos */
    const docs = [];
    pages.forEach((p, i) => {
      const c = cls[i];
      const last = docs[docs.length - 1];
      const consec = last && last.pages[last.pages.length - 1].index === p.index - 1;
      if (c.tipo === 'B' && last && last.tipo === 'B' && consec && c.fam === last.cls[0].fam && c.n != null && c.n > 1 && last.cls[last.cls.length - 1].n === c.n - 1) { last.pages.push(p); last.cls.push(c); return; }
      if (c.tipo === 'C' && last && last.tipo === 'C' && consec && c.n != null && last.cls[last.cls.length - 1].n != null && c.n > last.cls[last.cls.length - 1].n) { last.pages.push(p); last.cls.push(c); return; }

        const a1 = hAf[0] && numBelow(SS, hAf[0], { dyMax: 45, tol: 22 }), a2 = hAf[1] && numBelow(SS, hAf[1], { dyMax: 45, tol: 22 });
        void hS; void hB;
        if (a1 || a2) L.fsp = fMv((num(a1) || 0) + (num(a2) || 0), a1 || a2, [a1, a2].filter(Boolean).map((x) => x.t).join(' + '));
      }
      if (a.b.k === 'arl') { L.arl = fM(cot); L.pagadoArl = fM(tot); }
      if (a.b.k === 'ccf') L.ccf = fM(cot);
    });

    /* Detalle por cotizante (pág. 2): la fila se localiza por el valor bajo «IBC AFP» */
    const hAfp = P(/^ibc afp$/), hEps = P(/^ibc eps$/), hArl = P(/^ibc arl$/), hCcf = P(/^ibc ccf$/);
    const ibcRe = (x) => /^\d{1,3}(\.\d{3})*$/.test(x.t.trim());
    const rowIbc = hAfp && numBelow(S, hAfp, { dyMin: 5, dyMax: 90, tol: 16, pred: ibcRe });
    if (rowIbc) {

      d.cedula = fCedSeg(idS); d.tipoDoc = idS ? (idS.t.match(/^[A-Za-z]{2,3}/) || ['CC'])[0].toUpperCase() : null;
      /* Columna del nombre: la del encabezado «Apellidos y Nombres» (no coordenadas fijas: la página puede venir escalada o girada) */
      const hNm = P(/^apellidos y nombres$/, { pg: pgd });
      const nx0 = hNm ? hNm.x0 - 18 : 50, nx1 = hNm ? hNm.x1 + 18 : 114;
      const nm = cell(S, pgd, nx0, nx1, ry - 3, ry + 10, (s) => hasLetters(s) && !/\d/.test(s.t) && !/^(cc|ce|ti|pa|pep|ppt|nit)$/.test(s.n));
      d.nombre = nm.length ? mkF('texto', nm.map((s) => s.t).join(' ').replace(/\s+/g, ' '), nm[0]) : mkF('texto', null);
      const val = (h) => { const sg = h && S.filter((s) => s.pg === pgd && Math.abs(s.y - ry) <= 3 && isNum(s) && Math.abs(cx(s) - cx(h)) <= 16).sort((p, q) => Math.abs(cx(p) - cx(h)) - Math.abs(cx(q) - cx(h)))[0]; return sg ? fM(sg) : mkF('monto', null); };
      d.ibcAFP = val(hAfp); d.ibcEPS = val(hEps); d.ibcARL = val(hArl); d.ibcCCF = val(hCcf);
      d.ok = [d.ibcAFP, d.ibcEPS, d.ibcARL].every((f) => f.v != null);
      L.detalle.push(d);
    }
    const d0 = L.detalle[0];
    if (d0) { L.ibcPension = d0.ibcAFP; L.ibcSalud = d0.ibcEPS; L.ibcArl = d0.ibcARL; }
    L.nAfiliados = (() => { const s = P(/^no\. afiliados$/); return mkF('nro', L.detalle.length || null, s); })();
    return L;
  }

  /* ============================================================================================
     Familia 2 — «PLANILLA INTEGRADA AUTOLIQUIDACIÓN APORTES · SOPORTE DE PAGO GENERAL»
     ============================================================================================ */
  function leerSoporte(S, pages, cfg) {
    const L = vacio('soporte', pages);
    const val = (re, o) => { const h = find(S, re, o); if (!h) return null; const r = rowRight(S, h, 6)[0]; return r ? { h, r } : null; };
    let v = val(/^numero de identificacion:?$/);
    L.cedula = fCedSeg(v && v.r);
    v = val(/^numero planilla:?$/); L.numero = fNroSeg(v && v.r);
    v = val(/^nombre o razon social:?$/); L.nombre = fT(v && v.r);
    v = val(/^tipo de planilla:?$/); L.tipoPlanilla = fT(v && v.r);
    v = val(/^fecha pago/); L.fechaPago = fFechaSeg(v && v.r);
    v = val(/^dias de mora:?$/); L.diasMora = v ? mkF('nro', (v.r.t.match(/\d+/) || [null])[0], v.r) : mkF('nro', null);
    /* Periodos: «MES junio AÑO 2026» entre las etiquetas */
    const pO = find(S, /^periodo cotizacion otros/), pS = find(S, /^periodo cotizacion salud/);
    const txtRow = (h, hasta) => { if (!h) return null; const r = rowRight(S, h, 6).filter((s) => !hasta || s.x0 < hasta.x0 - 1); return r.length ? { t: r.map((s) => s.t).join(' '), seg: r[0] } : null; };
    const tO = txtRow(pO, pS), tS = txtRow(pS);
    L.periodoPension = tO ? fPeriodo(tO.seg, tO.t) : mkF('fecha', null);
    L.periodoSalud = tS ? fPeriodo(tS.seg, tS.t) : mkF('fecha', null);
    L.operador = operadorDe(S, cfg, 'soporte');
    /* Totales por subsistema: fila «SUBTOTALES:» de cada bloque → APORTES (1.º) … VALOR PAGADO (último) */
    const blocks = [
      { k: 'pension', re: /^total aportes a pension$/ }, { k: 'salud', re: /^total aportes a salud$/ },
      { k: 'arl', re: /^total aportes a riesgos profesionales$/ },
    ];
    const anch = blocks.map((b) => ({ b, s: find(S, b.re) })).filter((x) => x.s).sort((a, b) => a.s.vy - b.s.vy);
    anch.forEach((a, i) => {
      const y0 = a.s.vy, y1 = i + 1 < anch.length ? anch[i + 1].s.vy : y0 + 160;
      const sub = S.find((s) => s.vy > y0 && s.vy < y1 && /^subtotales:?$/.test(s.n));
      const fila = S.find((s) => s.vy > y0 && s.vy < y1 && s.x0 < 70 && /^[a-z]{0,4}\d{1,8}(-\d{1,3})?$/i.test(s.t.trim()));
      if (!sub) return;
      const nums = rowRight(S, sub, 4, isNum);
      if (nums.length < 2) return;
      const aportes = nums[0], pagado = nums[nums.length - 1];
      if (a.b.k === 'pension') {
        /* «APORTES» del subtotal incluye voluntarios y FSP; la cotización obligatoria está en la fila de la administradora */
        let cot = aportes;
        if (fila) { const rr = rowRight(S, fila, 4, isNum); const k = rr.filter((s) => /\$/.test(s.t)); if (k.length >= 5) { cot = k[0]; L.fsp = fMv((num(k[3]) || 0) + (num(k[4]) || 0), k[3], k[3].t + ' + ' + k[4].t); } }
        L.pension = fM(cot); L.pagadoPension = fM(pagado);
      }
      if (a.b.k === 'salud') { L.salud = fM(aportes); L.pagadoSalud = fM(pagado); }
      if (a.b.k === 'arl') { L.arl = fM(aportes); L.pagadoArl = fM(pagado); }
      void i;
    });
    const tp = find(S, /^total pagado:?$/);
    if (tp) { const r = rowRight(S, tp, 6, isNum)[0]; L.totalPagar = fM(r); }
    /* Si el documento no trae el bloque de riesgos laborales, no se pagó ARL en esa PILA */
    if (!anch.some((x) => x.b.k === 'arl')) { L.arl = mkF('monto', 0, null, 'sin bloque de riesgos'); L.pagadoArl = mkF('monto', 0, null, 'sin bloque de riesgos'); L.adv.push('La PILA no incluye el bloque «Total aportes a riesgos profesionales»; se toma el aporte a ARL como $0.'); }
    /* IBC: encabezados «IBC» de PENSIÓN, SALUD, ARP, CCF (de izquierda a derecha) bajo «LIQUIDACIÓN DETALLADA» y su valor debajo */
    const det0 = find(S, /^liquidacion detallada aportes$/);
    const ibcH = S.filter((s) => /^ibc$/.test(s.n) && det0 && s.pg === det0.pg && s.y > det0.y).sort((a, b) => a.x0 - b.x0);
    const ibcVal = (h) => (h ? numBelow(S, h, { dyMin: 5, dyMax: 90, tol: 28, pred: (s) => /^\d{1,3}(\.\d{3})+$/.test(s.t.trim()) }) : null);
    if (ibcH.length >= 2) {
      L.ibcPension = fM(ibcVal(ibcH[0])); L.ibcSalud = fM(ibcVal(ibcH[1]));
      L.ibcArl = ibcH.length >= 3 ? fM(ibcVal(ibcH[2])) : mkF('monto', null);
    }
    /* Detalle: cédula y nombre del cotizante (el nombre se parte en varias líneas dentro de una columna angosta) */
    const idS = det0 && S.find((s) => s.pg === det0.pg && s.y > det0.y + 60 && s.x0 < 135 && /^\d{5,12}(\s+[a-z]+)?$/.test(s.n));
    if (idS) {
      const tail = (idS.t.match(/^\d+\s+([A-Za-zÁÉÍÓÚÑáéíóúñ]+)$/) || [null, null])[1];
      const nm = cell(S, idS.pg, 98, 140, idS.y - 14, idS.y + 40, (s) => /^[A-ZÁÉÍÓÚÑ]{3,}$/.test(s.t) && !/^(INDEPEND|INDEPENDIE|COLOMBIANO|EXTRANJERO|CONTRATO|PRESTACION|NTE|ONES)/.test(s.t));
      const partes = (tail ? [tail] : []).concat(nm.map((s) => s.t));
      L.detalle.push({ cedula: fCedSeg(idS), tipoDoc: 'CC', nombre: partes.length ? mkF('texto', partes.join(' '), idS) : mkF('texto', null), ok: false, ibcAFP: L.ibcPension, ibcEPS: L.ibcSalud, ibcARL: L.ibcArl });
    }
    const nc = find(S, /^no\. cotizantes$/);
    const ncv = nc && numBelow(S, nc, { dyMax: 60, tol: 30, pred: (s) => /^\d{1,3}$/.test(s.t.trim()) });
    L.nAfiliados = mkF('nro', ncv ? ncv.t.trim() : null, ncv);
    return L;
  }

  /* ============================================================================================
     Familia 2b — «PLANILLA INTEGRADA AUTOLIQUIDACIÓN APORTES · SOPORTE DE PAGO PARA EL COTIZANTE» (1 página)
     Pares «etiqueta  valor» en cada fila; tres bloques (PENSIÓN, SALUD, RIESGOS PROFESIONALES) con IBC, cotización y total.
     ============================================================================================ */
  function leerCotizante(S, pages, cfg) {
    const L = vacio('cotizante', pages);
    const val = (re, o) => { const h = find(S, re, o); if (!h) return null; const r = rowRight(S, h, 5)[0]; return r ? { h, r } : null; };
    let v = val(/^nombre o razon social:?$/); L.nombre = fT(v && v.r);
    v = val(/^numero de identificacion:?$/); L.cedula = fCedSeg(v && v.r);
    v = val(/^numero planilla:?$/); L.numero = fNroSeg(v && v.r);
    v = val(/^tipo de planilla:?$/); L.tipoPlanilla = fT(v && v.r);
    v = val(/^fecha pago:?$/); L.fechaPago = fFechaSeg(v && v.r);
    v = val(/^dias de mora:?$/); L.diasMora = v ? mkF('nro', (v.r.t.match(/\d+/) || [null])[0], v.r) : mkF('nro', null);
    const pO = find(S, /^periodo cotizacion otros/), pS = find(S, /^periodo cotizacion salud/);
    const txtRow = (h, hasta) => { if (!h) return null; const r = rowRight(S, h, 5).filter((q) => !hasta || q.x0 < hasta.x0 - 1); return r.length ? { t: r.map((q) => q.t).join(' '), seg: r[0] } : null; };
    const tO = txtRow(pO, pS), tS = txtRow(pS);
    L.periodoPension = tO ? fPeriodo(tO.seg, tO.t) : mkF('fecha', null);
    L.periodoSalud = tS ? fPeriodo(tS.seg, tS.t) : mkF('fecha', null);
    L.operador = operadorDe(S, cfg, 'cotizante');
    /* Bloques de aportes: el título (PENSIÓN / SALUD / RIESGOS PROFESIONALES) está a la izquierda, sobre la fila «Administradora» */
    const top = find(S, /^aportes realizados a seguridad social$/);
    const ttl = (re) => S.find((q) => re.test(q.n) && q.x0 < 220 && (!top || (q.pg === top.pg && q.y > top.y)));
    const anchors = [{ k: 'pension', s: ttl(/^pension$/) }, { k: 'salud', s: ttl(/^salud$/) }, { k: 'arl', s: ttl(/^riesgos profesionales$/) }].filter((x) => x.s).sort((p, q) => p.s.y - q.s.y);
    const fin = find(S, /^total pagado:?$/);
    anchors.forEach((a, i) => {
      const y0 = a.s.y - 3, y1 = i + 1 < anchors.length ? anchors[i + 1].s.y - 3 : (fin ? fin.y - 1 : a.s.y + 120);
      const B = S.filter((q) => q.pg === a.s.pg && q.y >= y0 && q.y < y1);
      const lab = (re) => { const h = B.find((q) => re.test(q.n)); if (!h) return null; return rowRight(B, h, 4, isNum)[0] || null; };
      const ibc = lab(/^ibc$/), cot = lab(/^cotizacion obligatoria$/), tot = lab(/^total aporte$/);
      if (a.k === 'pension') {

        if (fs || fb) L.fsp = fMv((num(fs) || 0) + (num(fb) || 0), fs || fb, [fs, fb].filter(Boolean).map((q) => q.t).join(' + '));
      }
      if (a.k === 'salud') { L.ibcSalud = fM(ibc); L.salud = fM(cot || tot); L.pagadoSalud = fM(tot); }
      if (a.k === 'arl') { L.ibcArl = fM(ibc); L.arl = fM(tot || cot); L.pagadoArl = fM(tot || cot); }
    });
    if (!anchors.some((x) => x.k === 'arl')) { L.arl = mkF('monto', 0, null, 'sin bloque de riesgos'); L.pagadoArl = mkF('monto', 0, null, 'sin bloque de riesgos'); L.adv.push('La PILA no incluye el bloque «Riesgos profesionales»; se toma el aporte a ARL como $0.'); }
    if (fin) L.totalPagar = fM(rowRight(S, fin, 5, isNum)[0] || null);
    /* Cotizante (información básica) */
    const nm = val(/^nombres$/), ap = val(/^apellidos$/);
    const ci = S.filter((q) => /^numero de identificacion:?$/.test(q.n)).sort((p, q) => p.y - q.y)[1];
    const cedD = ci ? rowRight(S, ci, 5)[0] : null;
    const nombreD = nm && ap ? mkF('texto', (nm.r.t + ' ' + ap.r.t).replace(/\s+/g, ' ').trim(), nm.r) : mkF('texto', null);
    L.detalle.push({ cedula: cedD ? fCedSeg(cedD) : L.cedula, tipoDoc: 'CC', nombre: nombreD, ok: false, ibcAFP: L.ibcPension, ibcEPS: L.ibcSalud, ibcARL: L.ibcArl });
    L.nAfiliados = mkF('nro', 1, null, 'soporte de un solo cotizante');
    return L;
  }

  /* ============================================================================================
     Familia 3 — «AUTOLIQUIDACIÓN CONSOLIDADA» (PagoSimple y SuAporte)

  function leerConsolidada(S, pages, cfg) {

    const idS = S.find((s) => /^(cc|ce|ti|pa|pep|ppt|nit)\s*\d{4,}$/.test(s.n) && s.x0 < 60 && s.y > 250);
    if (idS) {
      const nm = cell(S, idS.pg, 40, 115, idS.y - 8, idS.y + 14, (s) => /^[A-ZÁÉÍÓÚÑ ]{3,}$/.test(s.t));

    }
    const ta = lab(/^total afiliados$/);
    L.nAfiliados = mkF('nro', ta ? (ta.r.t.match(/\d+/) || [null])[0] : null, ta && ta.r);

  }

  /* ============================================================================================
     Familia 4 — «PAGOSIMPLE · REPORTE INDIVIDUAL»
     ============================================================================================ */
  function leerIndividual(S, pages, cfg) {
    const L = vacio('individual', pages);
    const inl = (re) => { const h = find(S, re); if (!h) return null; const m = re.exec(h.n); const rem = h.t.slice(m.index + m[0].length).replace(/^[\s:]+/, '').trim(); return rem ? { h, t: rem, seg: h } : (() => { const r = rowRight(S, h, 5)[0]; return r ? { h, t: r.t, seg: r } : null; })(); };
    let v = inl(/^nume?ro planilla/); L.numero = v ? mkF('nro', (v.t.match(/\d{4,}/) || [null])[0], v.seg) : mkF('nro', null);
    v = inl(/^periodo cotizacion/); L.periodoSalud = v ? mkF('fecha', periodo(v.t), v.seg, v.t) : mkF('fecha', null); L.periodoPension = v ? mkF('fecha', periodo(v.t), v.seg, v.t) : mkF('fecha', null);
    v = inl(/^documento$/); L.cedula = v ? mkF('cedula', (v.t.match(/\d{5,}/) || [null])[0], v.seg, v.t) : mkF('cedula', null);
    v = inl(/^razon social$/); L.nombre = fT(v && v.seg, v && v.t);
    v = inl(/^tipo planilla/); L.tipoPlanilla = v ? mkF('texto', (v.t.match(/^[a-z]\b/i) || [v.t])[0], v.seg) : mkF('texto', null);
    const pag = S.find((s) => /^pagad[ao]\b/.test(s.n));
    L.fechaPago = fFechaSeg(pag);
    L.operador = operadorDe(S, cfg, 'individual');
    /* III. fila de la administradora: IBC AFP / EPS / ARL y aportes; IV. TOTALES: «Total Aportes …» */
    const hIbc = S.filter((s) => /^ibc (eps|arl|ccf)$/.test(s.n));
    const hEps = hIbc.find((s) => /eps$/.test(s.n)), hArl = hIbc.find((s) => /arl$/.test(s.n));
    const hAfp = S.find((s) => s.n === 'ibc' && hEps && s.pg === hEps.pg && Math.abs(s.y - hEps.y) <= 3);
    const ib = (h) => (h ? numBelow(S, h, { dyMin: 8, dyMax: 40, tol: 18 }) : null);
    L.ibcPension = fM(ib(hAfp)); L.ibcSalud = fM(ib(hEps)); L.ibcArl = fM(ib(hArl));
    const ht = find(S, /^iv\.?\s*totales$/);
    const SS = ht ? S.filter((s) => s.pg === ht.pg && s.y >= ht.y) : S;
    const col = (re) => { const h = SS.find((s) => re.test(s.n)); return h ? numBelow(SS, h, { dyMin: 10, dyMax: 70, tol: 24 }) : null; };
    L.pension = fM(col(/^total aportes pension$/)); L.salud = fM(col(/^total aportes salud$/)); L.arl = fM(col(/^total aportes riesgos$/)); L.ccf = fM(col(/^total aportes cajas$/));
    const a = col(/^total aportes fsp$/), b = col(/^total aportes fsps$/);
    if (a || b) L.fsp = fMv((num(a) || 0) + (num(b) || 0), a || b, [a, b].filter(Boolean).map((x) => x.t).join(' + '));
    L.totalPagar = fM(col(/^total final$/));
    L.pagadoSalud = L.salud; L.pagadoPension = L.pension; L.pagadoArl = L.arl;
    const d = find(S, /^documento$/, { minVy: (find(S, /^ii\.\s*datos del afiliado/) || { vy: 0 }).vy });
    const idS = S.find((s) => /^(cc|ce|ti|pa|pep|ppt|nit)\s*\d{4,}$/.test(s.n) && s.x0 < 130 && s.y > 220);
    if (idS) {
      const nm = S.filter((s) => s.pg === idS.pg && s.x0 > 240 && s.x0 < 420 && Math.abs(s.y - idS.y - 19) < 8 && /^[A-ZÁÉÍÓÚÑ ]{5,}$/.test(s.t))[0];
      L.detalle.push({ cedula: fCedSeg(idS), tipoDoc: idS.t.replace(/\d/g, '').trim(), nombre: nm ? mkF('texto', nm.t, nm) : mkF('texto', null), ok: false, ibcAFP: L.ibcPension, ibcEPS: L.ibcSalud, ibcARL: L.ibcArl });
    }
    void d;

        push(item('V5', 'V', nm + ': N.º de comisión del comprobante del ' + fechaTxt(E.fechaElab) + ' = N.º de solicitud SIIF', e,
          [ent('N.º de solicitud · SIIF', sn, 'SIIF'), ent('N.º de comisión · comprobante', E.nroComision, 'Comprobante')],
          e === OK ? 'Coinciden.' : e === NV ? 'No se pudo leer alguno de los números.' : 'El comprobante cita otra comisión.'));
      });
    });

    /* -------- V6 Completitud -------- */
    /* Páginas que la aplicación NO puede leer (sin texto o con texto ilegible): un documento «faltante» puede estar ahí. */
    const ilegibles = (pk.paginas || []).filter((e) => e.tipo === 'SIN_TEXTO' || e.tipo === 'ILEGIBLE').map((e) => e.n);
    const pagsIleg = ilegibles.length ? ' Hay ' + ilegibles.length + ' página(s) sin texto legible (pág. ' + ilegibles.join(', ') + ') que podrían ser ese documento: revíselas en «Revisión visual».' : '';
    const faltaE = ilegibles.length ? NV : ERR;
    const faltan = (obj, specs) => specs.filter(([k]) => fVal(obj[k]) == null).map(([, l]) => l);
    const v6 = (regla, miss, okTxt) => push(item('V6', 'V', regla, miss.length ? ERR : OK, [], miss.length ? 'Falta: ' + miss.join(', ') + '.' : okTxt || 'Todos los campos requeridos fueron extraídos.'));
    /* Si la casilla del N.º de PILA del mes anterior trae texto (p. ej. «Decreto 1273 de…») en lugar de un número, se dice tal cual */
    const v6p = (regla, miss) => {
      const txt = P && fVal(P.pilaNroTexto);
      const nota = txt && miss.includes('N.º planilla PILA (mes anterior)') ? ' La planilla SI trae en esa casilla el texto «' + txt + '» en lugar de un número' + (String(fVal(P.nroPago)).trim() === '1' ? ' (es el pago n.º 1 del contrato)' : '') + ': verifique si corresponde.' : '';
      push(item('V6', 'V', regla, miss.length ? ERR : OK, [], miss.length ? 'Falta: ' + miss.join(', ') + '.' + nota : 'Todos los campos requeridos fueron extraídos.'));
    };
    if (!P) push(item('V6', 'V', 'Planilla SI contratistas presente', ERR, [], 'El PDF trae otros documentos pero ninguna planilla SI contratistas.'));
    else v6p('Planilla SI: campos requeridos', faltan(P, [['nombre', 'nombre'], ['cedula', 'cédula'], ['fechaElab', 'fecha de elaboración'], ['compromiso', 'N.º compromiso SIIF'], ['honorarios', 'ingresos por honorarios'], ['comisiones', 'ingresos por comisiones'], ['pilaNro', 'N.º planilla PILA (mes anterior)'], ['ibc', 'IBC'], ['salud', 'aporte salud'], ['pension', 'aporte pensión'], ['arl', 'ARL'], ['proUCEVA', 'Pro-UCEVA']]));
    if (!L) push(item('V6', 'V', 'Planilla PILA presente', faltaE, [], 'No se encontró planilla PILA en el paquete.' + pagsIleg));
    else {
      (L.adv || []).forEach((a) => push(item('V6', 'V', 'PILA: aviso de lectura', ADV, [], a)));
      v6('PILA: campos requeridos', faltan(L, [['cedula', 'cédula del aportante'], ['numero', 'número de planilla'], ['periodoSalud', 'periodo de cotización'], ['fechaPago', 'fecha de pago'], ['salud', 'pago en salud'], ['pension', 'pago en pensión'], ['arl', 'pago en ARL']]));
    }
    G.forEach((gr) => {
      const nm = comNombre(gr);
      if (gr.siif) v6(nm + ' · SIIF: campos requeridos', faltan(gr.siif, [['fechaSolicitud', 'fecha de solicitud'], ['nro', 'N.º de solicitud'], ['total', 'total de la comisión']]));
      gr.informes.forEach((D) => v6(nm + ' · Informe ' + fechaTxt(D.fechaInforme) + ': campos requeridos', faltan(D, [['fechaInforme', 'fecha del informe'], ['orden', 'N.º de orden de viaje']])));
      gr.comprobantes.forEach((E) => v6(nm + ' · Comprobante ' + fechaTxt(E.fechaElab) + ': campos requeridos', faltan(E, [['fechaElab', 'fecha del informe (elaboración)'], ['cedula', 'documento de identidad'], ['nroComision', 'N.º de comisión'], ['total', 'total']])));
      gr.radicados.forEach((R) => v6(nm + ' · Radicado: campos requeridos', faltan(R, [['radicado', 'N.º de radicado']])));
      const faltaDoc = [];
      if (!gr.siif) faltaDoc.push('SIIF (autorización y ordenación del pago)');
      if (!gr.informes.length) faltaDoc.push('informe de legalización de desplazamiento');
      if (!gr.comprobantes.length) faltaDoc.push('comprobante de gastos de transporte');
      if (!gr.radicados.length) faltaDoc.push('informe de radicación');
      push(item('V6', 'V', nm + ': documentos que debe incluir', faltaDoc.length ? faltaE : OK, [], faltaDoc.length ? 'Falta: ' + faltaDoc.join(', ') + '.' + pagsIleg : 'Incluye SIIF, informe(s), comprobante y radicado.'));
      gr.adv.forEach((a) => push(item('V6', 'V', nm + ': consistencia de duplicados', ADV, [], a)));
    });
    if (P && fVal(P.comisiones) > 0 && !G.length) push(item('V6', 'V', 'Documentos de comisión requeridos', faltaE, [ent('Ingresos por comisiones', P.comisiones, 'Planilla SI')], 'La planilla reporta ingresos por comisiones: deben anexarse SIIF, informe, comprobante y radicado.' + pagsIleg));
    if (pk.noReconocidas && pk.noReconocidas.length) push(item('V6', 'V', 'Páginas no reconocidas', ADV, [], 'Páginas sin clasificar: ' + pk.noReconocidas.map((x) => x.n + (x.motivo ? ' (' + x.motivo + ')' : '')).join('; ') + '. Revíselas en la pestaña «Revisión visual».'));
    (pk.adv || []).forEach((a) => push(item('V6', 'V', 'Aviso del paquete', ADV, [], a)));

    /* -------- V7 Firmas -------- */
    X.listFirmas(pk).forEach((f) => {
      const req = ((cfg.firmasObligatorias || {})[f.tipoDoc] || {})[f.ref.rol] !== false;
      const est = f.ref.estado;
      let e;
      if (est === 'FIRMADA') e = OK;
      else if (est === 'SIN FIRMA') e = req ? ERR : OK;
      else e = req ? NV : OK;
      const A = f.ref.A, B = f.ref.B;
      const cmp = [
        { et: 'Método A (imágenes/trazos en el ROI)', val: A ? (A.images + ' imagen(es), ' + A.paths + ' trazo(s)') : 'sin medir', org: 'Pág. ' + (f.ref.pg + 1) },
        { et: 'Método B (tinta tras quitar texto y líneas)', val: B ? (B.ink + ' px, extensión ' + (Math.round(B.extent * 10) / 10) + ' pt' + (B.duda ? ' (indicios por debajo del umbral)' : '')) : 'sin medir', org: 'Pág. ' + (f.ref.pg + 1) },
      ];
      let ex = est === 'FIRMADA' ? 'Firma detectada' : est === 'SIN FIRMA' ? 'No se detectó firma' : 'Los métodos no coinciden o no se pudo medir';
      if (f.ref.manual) ex += ' (confirmado manualmente: ' + f.ref.manual + ')';
      else if (f.ref.nota) ex += '. ' + f.ref.nota;
      ex += req ? '.' : '. Firma no obligatoria según la configuración.';
      push(item('V7', 'V', f.etiqueta + ': ' + est, e, cmp, ex));
    });

    /* ==================== Complementarias ==================== */
    if (cfg.complementarias !== false) {
      const C = (id, regla, estado, comp, expl) => push(item(id, 'C', regla, estado, comp, expl));
      const eq = (a, b, tol) => (a == null || b == null ? NV : Math.abs(a - b) <= (tol || 0) ? OK : ADV);
      /* C1 aritmética de la planilla */
      if (P) {
        const v = (k) => fVal(P[k]);
        const hon = v('honorarios'), com = v('comisiones'), ti = v('totalIngresos');
        C('C1', 'Total ingresos = honorarios + comisiones', eq(ti, hon != null && com != null ? hon + com : null), [ent('Total ingresos', P.totalIngresos, 'Planilla SI'), entV('Honorarios + comisiones', hon != null && com != null ? U.fmtCOP(hon + com) : null, 'Planilla SI')], 'Aritmética de la planilla.');
        const sa = v('saldoAnterior'), vb = v('valorBruto'), ns = v('nuevoSaldo');
        C('C1', 'Saldo anterior − valor bruto = nuevo saldo', eq(ns, sa != null && vb != null ? sa - vb : null), [ent('Nuevo saldo', P.nuevoSaldo, 'Planilla SI'), entV('Saldo anterior − valor bruto', sa != null && vb != null ? U.fmtCOP(sa - vb) : null, 'Planilla SI')], 'Aritmética de la planilla.');
        C('C1', 'Honorarios = valor bruto del pago', eq(hon, vb), [ent('Honorarios', P.honorarios, 'Planilla SI'), ent('Valor bruto del pago', P.valorBruto, 'Planilla SI')], 'Aritmética de la planilla.');
        const desc = ['menosRetefuente', 'menosRetIVA', 'reteica', 'proUCEVA', 'univPacifico', 'otrasRetenciones', 'embargo'].map((k) => v(k) || 0).reduce((a, b) => a + b, 0);
        const rf = v('retefuentePeriodo') || 0;
        const neto = vb != null ? vb - Math.max(rf, v('menosRetefuente') || 0) - (desc - (v('menosRetefuente') || 0)) : null;
        C('C1', 'Valor a pagar = valor bruto − retención en la fuente − retenciones y descuentos listados − embargos', eq(v('valorAPagar'), neto), [ent('Valor a pagar', P.valorAPagar, 'Planilla SI'), entV('Cálculo', neto == null ? null : U.fmtCOP(neto), 'Planilla SI')], 'Descuentos considerados: retefuente, retención IVA, ReteICA, Pro-UCEVA, Universidad del Pacífico, otras retenciones y embargos.');
      }
      /* C2 PILA */
      if (L) {
        const pick = (k, k2) => (fVal(L[k]) != null ? fVal(L[k]) : fVal(L[k2]));
        const parts = [pick('pagadoSalud', 'salud'), pick('pagadoPension', 'pension'), pick('pagadoArl', 'arl')];
        const ccfV = fVal(L.ccf);
        const all = parts.every((x) => x != null);
        const s = all ? parts.reduce((a, b) => a + b, 0) + (ccfV || 0) : null;
        if (fVal(L.totalPagar) != null) C('C2', 'PILA: total a pagar = suma de los subsistemas', eq(fVal(L.totalPagar), s, 1), [ent('Total a pagar · PILA', L.totalPagar, 'PILA'), entV('Salud + pensión + ARL' + (ccfV ? ' + CCF' : '') + ' (valor pagado)', s == null ? null : U.fmtCOP(s), 'PILA')], 'Aritmética de la PILA (tolerancia $1 por redondeo)' + (ccfV == null ? '; la PILA no reporta aporte a CCF.' : '.'));
      }
      /* C3 recálculo de aportes */
      if (P) {
        const p = cfg.pct, hon = fVal(P.honorarios), ibc = fVal(P.ibc);
        const nota = ' El IBC de la planilla corresponde a los ingresos del mes anterior; aquí se compara con los honorarios del periodo actual, por lo que una diferencia puede ser legítima.';
        const calcIbc = hon != null ? hon * p.ibcSobreHonorarios : null;
        C('C3', 'IBC ≈ ' + (p.ibcSobreHonorarios * 100) + ' % de los honorarios', eq(ibc, calcIbc, p.tolIBC), [ent('IBC · planilla SI', P.ibc, 'Planilla SI'), entV('Honorarios × ' + p.ibcSobreHonorarios, calcIbc == null ? null : U.fmtCOP(Math.round(calcIbc)), 'Planilla SI')], 'Tolerancia ± ' + p.tolIBC + '.' + nota);
        const rc = (k, pct, nm, fld, doc, lbl) => {
          const calc = ibc != null ? ceilTo(ibc * pct, p.multiploRedondeo) : null;
          C('C3', nm + ' ≈ ' + Math.round(pct * 100000) / 1000 + ' % del IBC (aprox. al múltiplo de ' + p.multiploRedondeo + ')', eq(fVal(fld), calc, p.tolerancia), [ent(nm + ' · ' + lbl, fld, doc), entV('IBC × ' + pct, calc == null ? null : U.fmtCOP(calc), 'Cálculo')], 'Tolerancia ± ' + p.tolerancia + '.');
        };
        rc('salud', p.salud, 'Salud', P.salud, 'Planilla SI', 'planilla SI');
        rc('pension', p.pension, 'Pensión', P.pension, 'Planilla SI', 'planilla SI');
        rc('arl', p.arl, 'ARL (clase I)', P.arl, 'Planilla SI', 'planilla SI');
        if (L && fVal(L.ccf) > 0) rc('ccf', p.ccf, 'CCF', L.ccf, 'PILA', 'PILA');
        if (p.smmlv != null || cfg.smmlv != null) {
          const sm = cfg.smmlv;
          if (sm && ibc != null) C('C3', 'IBC dentro de límites (1 a 25 SMMLV)', ibc >= sm && ibc <= 25 * sm ? OK : ADV, [ent('IBC', P.ibc, 'Planilla SI'), entV('SMMLV configurado', U.fmtCOP(sm), 'Configuración')], 'Límites legales del IBC.');
        }
      }
      /* C4 nombre del archivo */
      if (ctx.fileName && cfg.patronArchivo) {
        let re = null; try { re = new RegExp(cfg.patronArchivo, 'i'); } catch (e) { re = null; }
        const m = re ? ctx.fileName.match(re) : null;
        if (!m) C('C4', 'Nombre del archivo sigue el patrón configurado', INFO, [entV('Archivo', ctx.fileName, 'Archivo')], 'El nombre no sigue el patrón; solo se informa.');
        else if (P) {
          const abr = String(m[4]).toUpperCase();
          const mesArch = U.MES_ABR_MAP[abr.toLowerCase()] || null;
          const chk = [
            ['Cédula', m[2] === fVal(P.cedula), m[2], fVal(P.cedula)],
            ['N.º compromiso SIIF', m[3] === fVal(P.compromiso), m[3], fVal(P.compromiso)],
            ['Mes', fe && mesArch === fe.m, abr, fe ? U.MES_ABR[fe.m - 1] : null],
            ['Año', fe && +m[5] === fe.y, m[5], fe ? fe.y : null],
          ];
          chk.forEach(([nm, ok, a, b]) => C('C4', 'Archivo vs planilla: ' + nm, b == null ? NV : ok ? OK : ADV, [entV(nm + ' en el nombre del archivo', a, 'Archivo'), entV(nm + ' en la planilla SI', b, 'Planilla SI')], ok ? 'Coincide.' : 'No coincide con el nombre del archivo.'));
        }
      }
      /* C5, C6, C7, C8 por comisión */
      G.forEach((gr) => {
        const nm = comNombre(gr);
        if (gr.siif) {
          const S = gr.siif;
          C('C5', nm + ': estado de la comisión = Autorizada', fVal(S.estado) == null ? NV : /autorizad/.test(U.norm(fVal(S.estado))) ? OK : ADV, [ent('Estado', S.estado, 'SIIF')], 'La comisión debe estar autorizada.');
          const a = fVal(S.viaticos), b = fVal(S.gastos);
          C('C5', nm + ': viáticos + gastos de viaje = total', eq(fVal(S.total), a != null && b != null ? a + b : null), [ent('Viáticos', S.viaticos, 'SIIF'), ent('Gastos de viaje', S.gastos, 'SIIF'), ent('Total', S.total, 'SIIF')], 'Aritmética del SIIF.');
        }
        /* C6 cobertura de fechas */
        if (gr.siif && gr.siif.tramos.length) {
          gr.siif.tramos.forEach((t) => {
            const d = fVal(t);
            const cubre = gr.informes.some((D) => {
              const i = fVal(D.fechaInicio), f = fVal(D.fechaFin) || i;
              return i && U.fechaNum(i) <= U.fechaNum(d) && U.fechaNum(d) <= U.fechaNum(f);
            });
            C('C6', nm + ': existe informe de legalización para el tramo del ' + U.fmtFecha(d), cubre ? OK : ADV, [entV('Tramo SIIF', U.fmtFecha(d), 'SIIF'), entV('Informes (inicio–fin)', gr.informes.map((D) => U.fmtFecha(fVal(D.fechaInicio)) + '–' + U.fmtFecha(fVal(D.fechaFin))).join('; ') || 'ninguno', 'Informes')], cubre ? 'El tramo está cubierto por un informe.' : 'Ningún informe cubre esa fecha.');
          });
          const tr = gr.siif.tramos.map((t) => fVal(t)).filter(Boolean).map((d) => U.fechaNum(d)).sort((a, b) => a - b);
          gr.informes.forEach((D) => {
            const i = fVal(D.fechaInicio), f = fVal(D.fechaFin);
            if (!tr.length || (!i && !f)) return;
            const fuera = [i, f].filter(Boolean).filter((d) => U.fechaNum(d) < tr[0] || U.fechaNum(d) > tr[tr.length - 1]);
            C('C6', nm + ': fechas de inicio y fin del informe ' + fechaTxt(D.fechaInforme) + ' dentro de las fechas autorizadas en el SIIF', fuera.length ? ADV : OK, [entV('Fechas autorizadas · SIIF', U.fmtFecha({ y: Math.floor(tr[0] / 10000), m: Math.floor(tr[0] / 100) % 100, d: tr[0] % 100 }) + ' – ' + U.fmtFecha({ y: Math.floor(tr[tr.length - 1] / 10000), m: Math.floor(tr[tr.length - 1] / 100) % 100, d: tr[tr.length - 1] % 100 }), 'SIIF'), entV('Inicio – fin · informe', U.fmtFecha(i) + ' – ' + U.fmtFecha(f), 'Informe')], fuera.length ? 'El informe declara fechas de desplazamiento fuera de las autorizadas en el SIIF.' : 'Dentro del rango autorizado.');
          });
          gr.comprobantes.forEach((E) => {
            const sa = U.uniq(gr.siif.tramos.map((t) => U.fechaNum(fVal(t)))).sort().join(','), sb = U.uniq(E.tramos.map((t) => U.fechaNum(fVal(t.fecha)))).sort().join(',');
            C('C6', nm + ': fechas de los tramos del comprobante = fechas del SIIF', sa === sb ? OK : ADV, [entV('Fechas SIIF', gr.siif.tramos.map((t) => U.fmtFecha(fVal(t))).join(', '), 'SIIF'), entV('Fechas comprobante', U.uniq(E.tramos.map((t) => U.fmtFecha(fVal(t.fecha)))).join(', '), 'Comprobante')], sa === sb ? 'Coinciden.' : 'Las fechas difieren.');
          });
        }
        /* C7 comprobante */
        gr.comprobantes.forEach((E) => {
          const vs = E.tramos.map((t) => fVal(t.valor));
          const s = vs.length && vs.every((x) => x != null) ? vs.reduce((a, b) => a + b, 0) : null;
          C('C7', nm + ': suma de los tramos del comprobante = total', eq(fVal(E.total), s), [ent('Total del comprobante', E.total, 'Comprobante'), entV('Suma de ' + E.tramos.length + ' tramo(s)', s == null ? null : U.fmtCOP(s), 'Comprobante')], 'Aritmética del comprobante.');
        });
        /* C8 fechas */
        const maxE = gr.comprobantes.map((E) => fVal(E.fechaElab)).filter(Boolean).sort((x, y) => U.fechaNum(y) - U.fechaNum(x))[0] || null;
        const fechasDesp = [].concat(gr.siif ? gr.siif.tramos.map((t) => fVal(t)) : [], gr.informes.map((D) => fVal(D.fechaFin) || fVal(D.fechaInicio))).filter(Boolean);
        const maxDesp = fechasDesp.sort((x, y) => U.fechaNum(y) - U.fechaNum(x))[0] || null;
        if (gr.comprobantes.length && maxDesp) C('C8', nm + ': fecha del comprobante ≥ fechas de los desplazamientos', U.fechaNum(maxE) >= U.fechaNum(maxDesp) ? OK : ADV, [entV('Fecha del comprobante', maxE ? U.fmtFecha(maxE) : null, 'Comprobante'), entV('Último desplazamiento', U.fmtFecha(maxDesp), 'SIIF/Informes')], (U.fechaNum(maxE) >= U.fechaNum(maxDesp) ? 'El comprobante se elabora después del último desplazamiento.' : 'La fecha del comprobante es anterior al último desplazamiento: revise si es un error de digitación o si el comprobante corresponde a otra comisión.'));
        gr.informes.forEach((D) => {
          const fi = fVal(D.fechaInforme), ff = fVal(D.fechaFin) || fVal(D.fechaInicio);
          if (fi && ff) C('C8', nm + ': fecha del informe ' + fechaTxt(D.fechaInforme) + ' ≥ fin del desplazamiento', U.fechaNum(fi) >= U.fechaNum(ff) ? OK : ADV, [entV('Fecha del informe', U.fmtFecha(fi), 'Informe'), entV('Fin del desplazamiento', U.fmtFecha(ff), 'Informe')], 'El informe se presenta después del desplazamiento.');
        });
        gr.comprobantes.forEach((E) => {
          if (fVal(E.fechaCiudad) == null) C('C8', nm + ': campo «Ciudad / municipio – Fecha» del comprobante del ' + fechaTxt(E.fechaElab), ADV, [ent('Ciudad / municipio – Fecha', E.fechaCiudad, 'Comprobante')], E.fechaCiudad && E.fechaCiudad.raw ? 'El campo trae «' + E.fechaCiudad.raw + '»' + (E.fechaCiudad.p ? ' (pág. ' + E.fechaCiudad.p + ')' : '') + ', que no se pudo interpretar como una fecha única (¿varios días?): confirme la fecha en el PDF.' : 'El campo está vacío o no contiene una fecha legible.');
          else if (!fVal(E.fechaCiudad).d) C('C8', nm + ': campo «Ciudad / municipio – Fecha» del comprobante del ' + fechaTxt(E.fechaElab), ADV, [ent('Ciudad / municipio – Fecha', E.fechaCiudad, 'Comprobante')], 'La fecha trae solo mes y año, sin día.');
        });
        gr.radicados.forEach((R) => {
          const fr = fVal(R.fecha);
          if (maxE && fr) C('C8', nm + ': fecha del radicado ≥ fecha del comprobante', U.fechaNum(fr) >= U.fechaNum(maxE) ? OK : ADV, [entV('Fecha del radicado', U.fmtFecha(fr), 'Radicado'), entV('Fecha del comprobante', U.fmtFecha(maxE), 'Comprobante')], 'El radicado se genera después del comprobante.');
          if (fe && fr) C('C8', nm + ': fecha del radicado ≤ fin del mes de elaboración de la planilla', U.fechaNum(fr) <= U.fechaNum(U.finDeMes(fe)) ? OK : ADV, [entV('Fecha del radicado', U.fmtFecha(fr), 'Radicado'), entV('Fin del mes de elaboración', U.fmtFecha(U.finDeMes(fe)), 'Planilla SI')], 'El radicado debe estar dentro del mes de presentación.');
        });
      });
      /* C9 informativos */
      const difiere = (a, b) => a && b && U.compararNombres(a, b) !== 'igual';
      if (P) {
        const supP = fVal(P.supervisorNombre), ordP = fVal(P.ordenadorNombre);
        G.forEach((gr) => {
          const nm = comNombre(gr);
          const sups = U.uniq([].concat(gr.informes.map((D) => fVal(D.supervisorNombre)), gr.comprobantes.map((E) => fVal(E.supervisorNombre))).filter(Boolean));
          sups.forEach((s) => { if (difiere(supP, s)) C('C9', nm + ': supervisor distinto al de la planilla SI', INFO, [entV('Supervisor · planilla SI', supP, 'Planilla SI'), entV('Supervisor · documentos de la comisión', s, 'Informe/Comprobante')], 'Informativo, no es un error: puede haber cambiado el supervisor entre meses.'); });
          const ordE = U.uniq(gr.comprobantes.map((E) => fVal(E.ordenadorNombre)).filter(Boolean));

/* store.js — persistencia local en IndexedDB (registros, PDFs originales, configuración).

(function (g) {
  'use strict';
  const VC = (g.VC = g.VC || {});

  function createStore(dbName) {
    let db = null;
    let mode = 'indexeddb';
    const memo = { registros: new Map(), pdfs: new Map(), config: new Map() };
    const KEYS = { registros: 'clave', pdfs: 'id', config: 'k' };

    function open() {
      return new Promise((resolve) => {
        if (!g.indexedDB) { mode = 'memoria'; return resolve(mode); }
        let req;
        try { req = g.indexedDB.open(dbName, 1); } catch (e) { mode = 'memoria'; return resolve(mode); }
        req.onupgradeneeded = () => {
          const d = req.result;
          Object.keys(KEYS).forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: KEYS[s] }); });
        };
        req.onsuccess = () => { db = req.result; mode = 'indexeddb'; resolve(mode); };
        req.onerror = () => { mode = 'memoria'; resolve(mode); };
        req.onblocked = () => { mode = 'memoria'; resolve(mode); };
      });
    }

    function run(store, rw, fn) {
      return new Promise((resolve, reject) => {
        if (mode === 'memoria') {
          try { resolve(memRun(store, fn)); } catch (e) { reject(e); }
          return;
        }
        let tx;
        try { tx = db.transaction(store, rw ? 'readwrite' : 'readonly'); } catch (e) { return reject(e); }
        let out;
        const os = tx.objectStore(store);
        const rq = fn(os);
        rq.onsuccess = () => { out = rq.result; };
        tx.oncomplete = () => resolve(out);
        tx.onerror = () => reject(tx.error || rq.error);
        tx.onabort = () => reject(tx.error || new Error('Transacción abortada'));
      });

    function memRun(store, fn) {
      const m = memo[store];
      const k = KEYS[store];
      const fake = {
        put: (v) => { m.set(v[k], clone(v)); return { result: v[k] }; },
        get: (key) => ({ result: m.has(key) ? clone(m.get(key)) : undefined }),
        delete: (key) => { m.delete(key); return { result: undefined }; },
        getAll: () => ({ result: Array.from(m.values()).map(clone) }),
        clear: () => { m.clear(); return { result: undefined }; },
      };
      const rq = fn(fake);

    function clone(v) {
      if (v instanceof Blob) return v;
      if (v && typeof v === 'object' && v.blob instanceof Blob) { const c = Object.assign({}, v); c.meta = v.meta ? JSON.parse(JSON.stringify(v.meta)) : v.meta; return c; }
      return JSON.parse(JSON.stringify(v));
    }

    return {
      get mode() { return mode; },
      get name() { return dbName; },
      open,
      putRegistro: (r) => run('registros', true, (os) => os.put(r)),
      getRegistro: (clave) => run('registros', false, (os) => os.get(clave)),
      allRegistros: () => run('registros', false, (os) => os.getAll()),
      deleteRegistro: (clave) => run('registros', true, (os) => os.delete(clave)),
      putPdf: (id, blob, meta) => run('pdfs', true, (os) => os.put({ id, blob, meta: meta || {} })),
      getPdf: (id) => run('pdfs', false, (os) => os.get(id)),
      allPdfs: () => run('pdfs', false, (os) => os.getAll()),
      deletePdf: (id) => run('pdfs', true, (os) => os.delete(id)),
      getConfig: (k) => run('config', false, (os) => os.get(k)).then((r) => (r ? r.v : undefined)),
      putConfig: (k, v) => run('config', true, (os) => os.put({ k, v })),
      deleteConfig: (k) => run('config', true, (os) => os.delete(k)),
      clearAll: () => Promise.all(['registros', 'pdfs', 'config'].map((s) => run(s, true, (os) => os.clear()))),

      /* Borra la base completa (usado por las autopruebas con una base temporal). */
      destroy: () => new Promise((resolve) => {
        if (db) { db.close(); db = null; }

  }

        s.onerror = () => reject(new Error('No se pudo cargar libs/pdf.worker.min.js. Verifique que la carpeta «libs» esté junto a index.html.'));
        document.head.appendChild(s);

    if (!e) return 'Error desconocido';

    if (e.name === 'InvalidPDFException') return 'El archivo no es un PDF válido o está dañado.';
    if (e.name === 'MissingPDFException') return 'No se encontró el PDF.';
    return (e.message || String(e)).slice(0, 300);

    return task.promise;

  /* ---------- Método B: tinta restante tras quitar texto y líneas largas ---------- */
  function measureInk(canvas, scale, model, roi, cfg) {
    const c = cfg.firma;
    const x0 = Math.max(0, Math.floor(roi.x0 * scale)), y0 = Math.max(0, Math.floor(roi.y0 * scale));
    const x1 = Math.min(canvas.width, Math.ceil(roi.x1 * scale)), y1 = Math.min(canvas.height, Math.ceil(roi.y1 * scale));
    const w = x1 - x0, h = y1 - y0;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const d = ctx.getImageData(x0, y0, w, h).data;
    const dark = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < dark.length; i++, p += 4) {
      const lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
      dark[i] = d[p + 3] > 40 && lum < c.lumUmbral ? 1 : 0;
    }

    const rowCnt = new Int32Array(h), colCnt = new Int32Array(w);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (dark[y * w + x]) { rowCnt[y]++; colCnt[x]++; }
    const rowCut = new Uint8Array(h), colCut = new Uint8Array(w);
    const fr = c.fraccionLinea == null ? 0.5 : c.fraccionLinea;
    for (let y = 0; y < h; y++) if (rowCnt[y] >= fr * w) { rowCut[y] = 1; }
    for (let x = 0; x < w; x++) if (colCnt[x] >= fr * h) { colCut[x] = 1; }

      const rec = await ctx().app.store.getPdf(S.reg.pdfId);

  async function procesarCola() {

      for (;;) {
        const it = S.cola.find((x) => x.estado === 'en cola');
        if (!it) break;
        it.estado = 'procesando'; it.msg = 'Iniciando…'; renderCola();
        const hooks = {
          progress: (p) => {
            if (p.fase === 'leer') { it.pct = Math.round((p.n / p.total) * 80); it.msg = 'Leyendo página ' + p.n + ' de ' + p.total; }
            else if (p.fase === 'analizar') { it.pct = 85; it.msg = 'Clasificando páginas y extrayendo datos…'; }
            else if (p.fase === 'firmas') { it.pct = 92; it.msg = 'Verificando firmas…'; }
            renderCola();
          },
          confirm: (msg) => confirmar('Misma cédula y mes, distinto nombre', msg, 'Reemplazar', true),
        };
        let out;
        try { out = await S.app.ingestarArchivo(it.file, hooks); } catch (e) { out = { archivo: it.file.name, resultados: [{ estado: 'error', mensaje: e.message || String(e) }], pendientes: [], error: e.message || String(e) }; }

        it.estado = out.error ? 'error' : 'listo';
        const n = (e) => out.resultados.filter((r) => r.estado === e).length;

  test('S4', 'Edición manual: conserva el valor original, recalcula las validaciones, se puede restaurar y rechaza valores inválidos', async () => {
    const { app, store, fin } = await tempApp();
    try {
      await guardar(app, pkBase({ com: 100000, comisiones: [comision(7001, 100000)] }), 'e.pdf');
      const k = '1234567|2026-09';
      let r = await store.getRegistro(k); eq(estadoDe(r.validacion, 'V4'), 'OK');
      r = await app.editarCampo(k, ['planilla', 'comisiones'], '$ 90.000', 'prueba');
      eq(fVal(r.paquete.planilla.comisiones), 90000); eq(r.paquete.planilla.comisiones.ed, true); eq(r.paquete.planilla.comisiones.orig.v, 100000); eq(estadoDe(r.validacion, 'V4'), 'ERROR'); eq(r.ediciones.length, 1);
      await lanza(() => app.editarCampo(k, ['planilla', 'comisiones'], 'abc'), 'valor inválido');
      r = await app.restaurarCampo(k, ['planilla', 'comisiones']); eq(fVal(r.paquete.planilla.comisiones), 100000); eq(r.paquete.planilla.comisiones.ed, false); eq(estadoDe(r.validacion, 'V4'), 'OK');
      r = await app.editarCampo(k, ['planilla', 'cedula'], '9998887'); eq(r.clave, '9998887|2026-09'); eq(await store.getRegistro(k), undefined, 'la clave antigua debe desaparecer');
    } finally { await fin(); }
  });
  test('S5', 'Decisión manual de firma: queda registrada y cambia el resultado final', async () => {
    const { app, store, fin } = await tempApp();
    try {
      const pk = bueno(); X.listFirmas(pk).forEach((x) => { x.ref.A = { images: 1, paths: 0, found: true }; x.ref.B = { ink: 0, extent: 0 }; });
      await guardar(app, pk, 'f.pdf'); const k = '1234567|2026-09';
      let r = await store.getRegistro(k); eq(r.validacion.global, 'REQUIERE REVISIÓN');
      for (const f of X.listFirmas(r.paquete)) await app.setFirmaManual(k, f.clave, 'FIRMADA', 'verificado visualmente');
      r = await store.getRegistro(k); eq(r.validacion.global, 'VÁLIDO'); assert(r.ediciones.length >= 1, 'sin registro de la decisión');
    } finally { await fin(); }
  });
  test('S6', 'CSV: BOM UTF-8, separador «;», comillas escapadas y protección contra fórmulas', async () => {
    const { app, fin } = await tempApp();
    try {
      await guardar(app, pkBase({ nombre: '=SUMA(1;2) "X"' }), 'c.pdf');
      const csv = await app.csvResumen(); assert(csv.charCodeAt(0) === 0xfeff, 'falta BOM'); assert(csv.indexOf(';') > 0); assert(csv.indexOf("\"'=SUMA(1;2) \"\"X\"\"\"") >= 0, 'nombre mal escapado: ' + csv.slice(0, 400));
      assert(/\r\n/.test(csv)); assert((await app.csvValidaciones()).length > 50);
    } finally { await fin(); }
  });
  test('S7', 'Respaldo JSON: exportar, vaciar, importar (reemplazar) restituye registros y PDF; archivo inválido se rechaza', async () => {
    const { app, store, fin } = await tempApp();
    try {
      await guardar(app, pkBase({ cedula: '1' }), 'a.pdf'); await guardar(app, pkBase({ cedula: '2' }), 'b.pdf');
      const txt = await app.exportarRespaldo(true);
      await store.clearAll(); eq((await store.allRegistros()).length, 0);
      const r = await app.importarRespaldo(txt, 'reemplazar'); eq(r.nuevos, 2);
      eq((await store.allRegistros()).length, 2); const reg = (await store.allRegistros())[0]; const pdf = await store.getPdf(reg.pdfId); assert(pdf && pdf.blob.size > 100, 'el PDF no volvió');
      await lanza(() => app.importarRespaldo('{no es json', 'combinar')); await lanza(() => app.importarRespaldo('{"formato":"otro"}', 'combinar'));
      await lanza(() => app.importarRespaldo(JSON.stringify({ formato: 'validador-contratistas', version: 1, registros: [{ clave: 'x' }] }), 'combinar'));
    } finally { await fin(); }
  });
  test('S8', 'Persistencia real: los datos sobreviven al cerrar y reabrir la base', async () => {
    const nombre = 'vc_test_' + VC.core.uid();
    const s1 = VC.store.create(nombre); await s1.open(); const a1 = VC.core.createApp(s1);
    try {
      eq(s1.mode, 'indexeddb'); await guardar(a1, pkBase(), 'p.pdf'); s1.close();
      const s2 = VC.store.create(nombre); await s2.open(); eq((await s2.allRegistros()).length, 1); s2.close();
    } finally { const s3 = VC.store.create(nombre); await s3.open(); await s3.destroy(); }
  });
  test('S9', 'Configuración: se guarda, se recupera y cambia el resultado de las validaciones', async () => {
    const { app, store, fin } = await tempApp();
    try {
      await guardar(app, pkBase(), 'cfg.pdf'); const k = '1234567|2026-09';
      const antes = await store.getRegistro(k); const c3 = (r) => r.validacion.items.filter((i) => i.id === 'C3').map((i) => i.estado).join(',');
      const nueva = X.cloneCfg(app.cfg); nueva.pct.salud = 0.2; await app.saveConfig(nueva); await app.revalidarTodos();
      const desp = await store.getRegistro(k); assert(c3(antes) !== c3(desp), 'el cambio de porcentaje no afectó C3');
      const app2 = VC.core.createApp(store); await app2.loadConfig(); eq(app2.cfg.pct.salud, 0.2);
    } finally { await fin(); }
  });

  /* ---------- Ejecución ---------- */
  async function runAll(onResult) {
    const out = [];
    for (const t of T) {
      let r;
      try { await t.fn(); r = { id: t.id, nombre: t.nombre, ok: true, detalle: '' }; } catch (e) { r = { id: t.id, nombre: t.nombre, ok: false, detalle: (e && e.message) || String(e) }; }
      out.push(r);
      if (onResult) onResult(r);
      await U.tick();
    }
    return out;
  }
  VC.tests = { runAll, lista: () => T.map((t) => ({ id: t.id, nombre: t.nombre })) };
})(typeof window !== 'undefined' ? window : globalThis);
